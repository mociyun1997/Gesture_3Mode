<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>东方色谱 · ORIENTAL PALETTE</title>
<style>
:root{
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC","Source Han Serif SC",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  --lat:"Optima","Palatino Linotype","Georgia",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0e0e10;overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:#fff;user-select:none;cursor:default}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;width:1600px;height:900px;flex:0 0 auto;transform-origin:center center;
  box-shadow:0 40px 120px rgba(0,0,0,.6);overflow:hidden;background:#111}

/* ---------------- slide base ---------------- */
.slide{position:absolute;inset:0;overflow:hidden;
  opacity:0;visibility:hidden;transform:scale(1.035);
  transition:opacity .85s ease, transform 1.15s cubic-bezier(.16,.84,.30,1), visibility .85s;}
.slide.active{opacity:1;visibility:visible;transform:scale(1)}
.slide.past{transform:scale(.985)}

.bg{position:absolute;inset:0;background:var(--c)}
.slide[data-tone="light"] .bg{
  background:
    radial-gradient(120% 110% at 12% 8%, rgba(255,255,255,.62), rgba(255,255,255,0) 58%),
    radial-gradient(110% 130% at 88% 96%, rgba(0,0,0,.20), rgba(0,0,0,0) 55%),
    linear-gradient(115deg, rgba(255,255,255,.18), rgba(0,0,0,.06)),
    var(--c);
}
.slide[data-tone="dark"] .bg{
  background:
    radial-gradient(120% 110% at 14% 6%, rgba(255,255,255,.16), rgba(255,255,255,0) 55%),
    radial-gradient(120% 140% at 86% 98%, rgba(0,0,0,.55), rgba(0,0,0,0) 60%),
    linear-gradient(115deg, rgba(255,255,255,.06), rgba(0,0,0,.22)),
    var(--c);
}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.55'/></svg>")}
.vign{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 220px rgba(0,0,0,.22)}

/* ---------------- decoration ---------------- */
.ring{position:absolute;border-radius:50%;border:1px solid currentColor;opacity:.20}
.b1,.b2,.b3{position:absolute;border-radius:50%;filter:blur(60px);opacity:.30;pointer-events:none}
.b1{width:520px;height:520px;background:#fff}
.b2{width:420px;height:420px;background:#000}
.b3{width:300px;height:300px;background:var(--c);filter:blur(40px);opacity:.55}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-34px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,26px)}}
.active .b1{animation:floatA 22s ease-in-out infinite}
.active .b2{animation:floatB 27s ease-in-out infinite}
.slide[data-tone="light"] .b1{opacity:.45}
.slide[data-tone="light"] .b2{opacity:.07}
.slide[data-tone="light"] .b3{opacity:.30}
.slide[data-tone="dark"] .b1{opacity:.10}
.slide[data-tone="dark"] .b2{opacity:.34}
.slide[data-tone="dark"] .b3{opacity:.45}

/* ---------------- shared text ---------------- */
.eyebrow{font-family:var(--lat);letter-spacing:.34em;text-transform:uppercase;font-size:14px;opacity:.62}
.hintline{font-family:var(--lat);letter-spacing:.22em;font-size:12px;opacity:.5}

/* footer */
.foot{position:absolute;left:80px;bottom:42px;right:80px;display:flex;justify-content:space-between;
  align-items:flex-end;font-size:13px;letter-spacing:.16em;opacity:.55}
.foot .r{font-family:var(--lat);letter-spacing:.2em}

/* circle page index */
.pager{position:absolute;left:80px;top:70px;font-family:var(--lat);font-size:13px;letter-spacing:.24em;opacity:.6}
.pager b{font-weight:400;font-size:20px;letter-spacing:.04em}

/* ============================ COVER ============================ */
.cover-wrap{position:absolute;inset:0;background:#15161a;overflow:hidden}
.cover-wrap .wash{position:absolute;inset:-20%;filter:blur(90px);opacity:.5}
.cover-wrap .wash i{position:absolute;border-radius:50%;width:46%;height:46%;display:block}
.cover-panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}
.cover-title{font-family:var(--serif);font-size:150px;letter-spacing:.22em;text-indent:.22em;
  color:#F3EDE3;font-weight:400;line-height:1;text-shadow:0 0 60px rgba(0,0,0,.5)}
.cover-sub{margin-top:26px;font-family:var(--lat);letter-spacing:.5em;text-indent:.5em;
  font-size:17px;color:#B9AE9C}
.cover-cn{margin-top:52px;font-family:var(--kai);font-size:22px;letter-spacing:.34em;color:#8E8677}
.bars{position:absolute;left:0;bottom:0;display:flex;width:100%;height:6px}
.bars i{flex:1;height:100%;transform-origin:bottom;animation:barIn 1.1s cubic-bezier(.2,.9,.25,1) both}
@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sealbox{position:absolute;right:96px;top:96px;width:96px;height:96px;border:1px solid rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;
  color:#C9BFAE;font-size:11px;letter-spacing:.18em;opacity:.75}

/* ============================ INTRO ============================ */
.intro-wrap{position:absolute;inset:0;padding:120px 90px;color:var(--ink)}
.intro-h{font-family:var(--serif);font-size:74px;letter-spacing:.08em}
.intro-sub{margin-top:18px;font-family:var(--kai);font-size:23px;letter-spacing:.16em;opacity:.68}
.intro-lead{margin-top:46px;max-width:840px;font-family:var(--kai);font-size:27px;line-height:2.05;opacity:.85}
.intro-cards{position:absolute;left:90px;right:90px;bottom:96px;display:flex;gap:26px}
.intro-card{flex:1;border-top:1px solid currentColor;padding-top:20px;opacity:.9}
.intro-card h4{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:.1em}
.intro-card p{margin-top:12px;font-family:var(--kai);font-size:19px;line-height:1.85;opacity:.72}

/* ============================ COLOR SLIDE ============================ */
.cwrap{position:absolute;inset:0;color:var(--ink)}
.pinyin-top{position:absolute;right:92px;top:78px;text-align:right}
.pinyin-top .p{font-family:var(--lat);font-size:22px;letter-spacing:.14em;opacity:.72}
.pinyin-top .hex{font-family:var(--lat);font-size:13px;letter-spacing:.22em;opacity:.5;margin-top:8px}

.ctitle{position:absolute;left:132px;top:112px;display:flex;gap:14px;writing-mode:vertical-rl;
  font-family:var(--serif);font-size:132px;letter-spacing:.16em;line-height:1.06}
.ctitle span{display:block}

.cbody{position:absolute;right:110px;top:190px;width:600px}
.cbody .poem{font-family:var(--kai);font-size:44px;line-height:1.7;letter-spacing:.1em;white-space:pre-line;
  text-shadow:0 1px 24px rgba(0,0,0,.12)}
.cbody .rule{width:64px;height:1px;background:currentColor;opacity:.45;margin:30px 0 26px}
.cbody .desc{font-size:19px;line-height:2.15;letter-spacing:.04em;opacity:.78}
.chips{display:flex;gap:14px;margin-top:34px}
.chips i{width:74px;height:74px;border-radius:6px;border:1px solid rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;font-family:var(--lat);font-size:10px;
  letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);font-style:normal}
.chips i:nth-child(1){opacity:.55}
.chips i:nth-child(3){opacity:.55}
.bigno{position:absolute;left:70px;bottom:96px;font-family:var(--lat);font-size:190px;
  opacity:.055;letter-spacing:-.02em;line-height:1}

/* ============================ INDEX ============================ */
.idx-wrap{position:absolute;inset:0;padding:100px 84px;color:var(--ink)}
.idx-h{font-family:var(--serif);font-size:62px;letter-spacing:.16em}
.idx-sub{font-family:var(--lat);letter-spacing:.34em;font-size:13px;opacity:.55;margin-top:14px}
.idx-grid{margin-top:52px;display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.idx-item{cursor:pointer;transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.idx-item:hover{transform:translateY(-8px)}
.idx-item .sw{height:150px;border-radius:8px;border:1px solid rgba(255,255,255,.22);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;
  font-family:var(--serif);font-size:22px;letter-spacing:.14em;color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.28)}
.idx-item .mn{margin-top:10px;text-align:center;font-family:var(--lat);font-size:11.5px;letter-spacing:.1em;opacity:.6}

/* ============================ END ============================ */
.end-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F0E9DC}
.end-wrap .q{font-family:var(--kai);font-size:44px;letter-spacing:.16em;line-height:1.9;text-align:center;max-width:1060px}
.end-wrap .en{margin-top:60px;font-family:var(--lat);letter-spacing:.46em;font-size:14px;opacity:.6}
.end-wrap .sm{margin-top:26px;font-size:13px;letter-spacing:.2em;opacity:.38}

/* ---------------- entry animation ---------------- */
@keyframes up{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}
@keyframes rightin{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes leftin{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes cdrop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}

.slide.active .ctitle span{animation:cdrop .95s cubic-bezier(.18,.9,.24,1) both}
.slide.active .ctitle span:nth-child(1){animation-delay:.14s}
.slide.active .ctitle span:nth-child(2){animation-delay:.26s}
.slide.active .cbody .poem{animation:rightin .95s .22s cubic-bezier(.18,.9,.24,1) both}
.slide.active .cbody .rule{animation:fade 1s .5s both}
.slide.active .cbody .desc{animation:rightin 1s .42s cubic-bezier(.18,.9,.24,1) both}
.slide.active .chips i{animation:up .8s both}
.slide.active .chips i:nth-child(1){animation-delay:.62s}
.slide.active .chips i:nth-child(2){animation-delay:.70s}
.slide.active .chips i:nth-child(3){animation-delay:.78s}
.slide.active .pinyin-top{animation:leftin .9s .3s cubic-bezier(.18,.9,.24,1) both}
.slide.active .pager{animation:fade 1s .55s both}
.slide.active .foot{animation:fade 1s .6s both}
.slide.active .bigno{animation:fade 1.4s .2s both}
.slide.active .intro-h{animation:up .9s .1s cubic-bezier(.18,.9,.24,1) both}
.slide.active .intro-sub{animation:up .9s .2s cubic-bezier(.18,.9,.24,1) both}
.slide.active .intro-lead{animation:up 1s .3s cubic-bezier(.18,.9,.24,1) both}
.slide.active .intro-card{animation:up .9s both}
.slide.active .intro-card:nth-child(1){animation-delay:.44s}
.slide.active .intro-card:nth-child(2){animation-delay:.54s}
.slide.active .intro-card:nth-child(3){animation-delay:.64s}
.slide.active .cover-title{animation:up 1.1s .2s cubic-bezier(.18,.9,.24,1) both}
.slide.active .cover-sub{animation:up 1.1s .38s cubic-bezier(.18,.9,.24,1) both}
.slide.active .cover-cn{animation:up 1.1s .54s cubic-bezier(.18,.9,.24,1) both}
.slide.active .sealbox{animation:fade 1.4s .8s both}
.slide.active .idx-h{animation:up .9s .1s both}
.slide.active .idx-sub{animation:up .9s .2s both}
.slide.active .idx-item{animation:up .7s both}
.slide.active .end-wrap .q{animation:up 1.1s .15s cubic-bezier(.18,.9,.24,1) both}
.slide.active .end-wrap .en{animation:up 1.1s .45s cubic-bezier(.18,.9,.24,1) both}
.slide.active .end-wrap .sm{animation:fade 1.6s .9s both}

/* ---------------- UI controls ---------------- */
#ctrl{position:fixed;right:22px;bottom:20px;display:flex;gap:10px;z-index:60}
#ctrl button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(20,20,22,.55);color:#ddd;font-size:15px;cursor:pointer;backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;transition:.25s;font-family:var(--lat)}
#ctrl button:hover{background:rgba(255,255,255,.14);color:#fff;transform:translateY(-2px)}
#ctrl button.on{background:#C9A227;color:#1a1a1a;border-color:#C9A227}
#ctrl button.play{width:auto;padding:0 20px;border-radius:22px;gap:6px;letter-spacing:.1em;font-size:12px}

#progress{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,#C9A227,#E4C6D0,#8FB6B8);
  z-index:70;transition:width .8s cubic-bezier(.16,.84,.3,1);box-shadow:0 0 12px rgba(201,162,39,.6)}

#navHint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.35);transition:opacity .6s}

#gate{position:fixed;inset:0;z-index:100;background:#121214;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;cursor:pointer}
#gate h1{font-family:var(--serif);font-size:52px;letter-spacing:.3em;text-indent:.3em;color:#EFE7DA;font-weight:400}
#gate p{font-size:13px;letter-spacing:.26em;color:#8d8778}
#gate .btn{margin-top:10px;padding:16px 44px;border:1px solid rgba(255,255,255,.28);border-radius:40px;
  color:#E8DFCF;font-size:14px;letter-spacing:.28em;transition:.35s}
#gate:hover .btn{background:rgba(255,255,255,.1);letter-spacing:.34em}
#gate .tip{font-size:12px;color:#6a6558;letter-spacing:.16em;margin-top:18px}
.hide{display:none!important}

@media print{
  @page{size:297mm 167mm;margin:0}
  html,body{overflow:visible;background:#fff;height:auto}
  #ctrl,#progress,#navHint,#gate{display:none!important}
  #viewport{position:static;display:block}
  #deck{width:auto;height:auto;transform:none!important;box-shadow:none}
  .slide{position:relative;display:block!important;opacity:1!important;visibility:visible!important;
    transform:none!important;width:1122px;height:631px;overflow:hidden;
    page-break-after:always;break-after:page}
  .slide>*{width:1600px!important;height:900px!important;
    transform:scale(.7016);transform-origin:top left;animation:none!important}
  .slide .bars{width:1600px}
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="viewport"><div id="deck"></div></div>

<div id="navHint">← → 翻页 &nbsp;·&nbsp; 空格自动放映 &nbsp;·&nbsp; 滚轮亦可</div>

<div id="ctrl">
  <button id="bPlay" class="play" title="自动放映">▶ 放映</button>
  <button id="bNar" title="解说 On/Off">解说</button>
  <button id="bMus" title="背景音乐 On/Off">音乐</button>
  <button id="bPrev" title="上一页">‹</button>
  <button id="bNext" title="下一页">›</button>
</div>

<div id="gate">
  <h1>东方色谱</h1>
  <p>ORIENTAL PALETTE · 十二种中国传统色</p>
  <div class="btn" id="gateBtn">点击进入</div>
  <div class="tip">建议戴上耳机 · 含背景音乐与人声解说</div>
</div>

<audio id="bgm" src="assets/bgm.wav" loop preload="auto"></audio>

<script>
/* ========================= 数据 ========================= */
const C = [
  {n:"月白",p:"yuè bái",hex:"#D6ECF0",tone:"light",ink:"#31454E",
   poem:"月光落在\n素练之上",
   desc:"月白不是纯白，而是蓝到几乎看不见的一点冷意。清人以此色做常服与衫子，取其清而不寒、素而不寡——穿在身上，像把一小片夜色披了出去。",
   chips:["#EAF4F6","#C3DFE4","#A9CBD1"],
   nar:"第一个颜色，月白。它不是白，是蓝得非常小心的白。古人看见月光落在未经漂白的绢上，就把那一点冷意留了下来，做成衣衫。"},

  {n:"天青",p:"tiān qīng",hex:"#8FB6B8",tone:"dark",ink:"#F4FBFA",
   poem:"雨过天晴\n云破处",
   desc:"相传宋徽宗梦中见到雨过天晴的颜色，醒来便命汝窑烧造此色。天青介于蓝与绿之间，温润如玉，是瓷器史上最难留住的那一瞬天光。",
   chips:["#A9C9C9","#6F9EA1","#C9DEDD"],
   nar:"第二个颜色，天青。传说宋徽宗梦见雨过天晴的颜色，醒来后要工匠烧出梦里的那一瞬。天青在蓝与绿之间，像瓷器上久久不散的水气。"},

  {n:"竹青",p:"zhú qīng",hex:"#789262",tone:"dark",ink:"#F3F6EC",
   poem:"新竹高于\n旧竹枝",
   desc:"竹青里带着一点黄，是植物尚未老去时的绿。它不像松柏那样沉稳，也不似嫩柳那般轻佻，古人以之比少年：有节，且还在往上长。",
   chips:["#8FA673","#5F7A4E","#A8BC8E"],
   nar:"第三个颜色，竹青。它不是成熟的绿，是新竹尚未褪去的那一点鹅黄。古人说新竹高于旧竹枝，便拿这个颜色比作少年。"},

  {n:"石绿",p:"shí lǜ",hex:"#2FA379",tone:"dark",ink:"#EFFAF4",
   poem:"青苔写在\n石头上的字",
   desc:"石绿由孔雀石研磨而来。敦煌壁画里飞天的裙裾、青绿山水中层层叠叠的山峦，都是它。矿物之色不随年月褪去，千年之后仍在缓慢呼吸。",
   chips:["#57B88F","#1F7A5B","#86D0B2"],
   nar:"第四个颜色，石绿。它来自一种叫孔雀石的矿石，磨成粉末，画在敦煌的壁画上。矿物色不会褪去，所以一千年后，我们还能看见那时的飞天穿着它。"},

  {n:"秋香",p:"qiū xiāng",hex:"#C9A227",tone:"light",ink:"#3E2C10",
   poem:"把整个秋天\n揉进一片叶子",
   desc:"秋香是黄里带绿、绿里又藏一点褐的复杂颜色，恰如深秋的桂香散尽之后。明清织绣常用此色，是富而不显的那种体面。",
   chips:["#D9BE5A","#A78522","#E4D59A"],
   nar:"第五个颜色，秋香。它是黄里带绿、绿里藏褐的一种复杂味道，像深秋的桂花快要散尽时。这种颜色不张扬，但很讲究。"},

  {n:"缃色",p:"xiāng sè",hex:"#F0C239",tone:"light",ink:"#4A3410",
   poem:"书卷翻开\n的颜色",
   desc:"缃，浅黄色的帛。古人以缃色布帛做书衣，于是「缃帙」成了书的代称。它比黄金温和，比泥土明亮，是一间书房本来的样子。",
   chips:["#F5D566","#D3A023","#FBE9A8"],
   nar:"第六个颜色，缃色。古人用淡黄色的丝帛做书的封套，所以后来，缃帙两个字就成了书的别称。这是一种闻起来有墨与纸味道的颜色。"},

  {n:"藕荷",p:"ǒu hé",hex:"#E4C6D0",tone:"light",ink:"#4A3038",
   poem:"荷塘深处的\n那一声低语",
   desc:"藕荷是紫色被稀释之后留下的那一点灰，冷里带甜。晚清的瓷器、闺阁的衣饰格外偏爱它——东方审美的要义，往往就在这退让的一步。",
   chips:["#EED8DF","#C9A3B2","#F2E6EA"],
   nar:"第七个颜色，藕荷。紫被稀释之后剩下的那一点灰粉，冷里带甜。东方审美里有一种高级，叫退一步，藕荷就是那一步。"},

  {n:"胭脂",p:"yān zhī",hex:"#9D2933",tone:"dark",ink:"#F8E9E9",
   poem:"一点朱红\n落在唇上",
   desc:"取自红蓝花之汁，晒而为饼，温水化开即为妆色。它并不只属于女子：信笺上的泪痕、陌上菩提的暮色，也都用这同一个名字。",
   chips:["#B3454F","#7C1E27","#C8737C"],
   nar:"第八个颜色，胭脂。它取自一种叫红蓝花的花，晒成小饼，用水化开，就成了妆色。但它不只属于女子的唇，也属于信纸上晕开的那滴泪。"},

  {n:"朱砂",p:"zhū shā",hex:"#C3272B",tone:"dark",ink:"#FFF3EF",
   poem:"宫墙与印章\n的颜色",
   desc:"朱砂由辰砂研磨而成，沉重、稳定、不容置疑。皇帝用它批阅奏折，画家在整幅水墨将完成时，用它点上最后的一笔清醒。",
   chips:["#D94848","#9E1F22","#E37777"],
   nar:"第九个颜色，朱砂。它来自矿物辰砂，沉重而稳定。皇帝拿它批奏折，画家在整幅水墨快画完时，用它点上最提神的一笔。"},

  {n:"赭石",p:"zhě shí",hex:"#8C4A32",tone:"dark",ink:"#F5E7DC",
   poem:"大地本身的\n肤色",
   desc:"赭者，赤土也。岩壁上的画、夯土的墙、老僧的袈裟，都取此色。它是所有颜色里最沉默、也最古老的一个——早在我们学会命名之前，它就在那里。",
   chips:["#A86244","#6C3722","#C08E68"],
   nar:"第十个颜色，赭石。赭，就是红色的土。岩壁上的岩画、夯土的墙、老僧的袈裟，都是这个颜色。它最古老，也最沉默。"},

  {n:"黛蓝",p:"dài lán",hex:"#2E4E6B",tone:"dark",ink:"#E7EEF4",
   poem:"远山如黛\n近水含烟",
   desc:"黛是女子画眉用的青黑颜料。把它从眉间放回天地，便成了黄昏时远山的轮廓——深、静、退让，退到最远处，才是它真正的 位置。",
   chips:["#41678A","#1E3547","#6E8FA8"],
   nar:"第十一个颜色，黛蓝。黛本是画眉的颜料，把它从眉间放回天地，就成了黄昏时远山的轮廓。它很远，所以才好看。"},

  {n:"玄色",p:"xuán sè",hex:"#33322E",tone:"dark",ink:"#EFE7DA",
   poem:"天谓之玄\n地谓之黄",
   desc:"《千字文》开篇第一句：天地玄黄。玄是黑中透赤，是黎明前最深的那一刻。它并不结束什么——恰恰相反，它开始了一切。",
   chips:["#4C4A44","#1F1E1B","#6E6B63"],
   nar:"最后一个颜色，玄色。千字文的第一句，天地玄黄。玄是黑里透红，是天快亮之前那一刻最深的颜色。它不结束什么，它开始一切。"}
];

/* ========================= 渲染 ========================= */
/* ========================= 组装幻灯片序列 ========================= */
const SLIDES = [];
SLIDES.push({t:'cover', nar:"欢迎翻开这一册《东方色谱》。这是一场关于颜色的旅行，十二种来自东方的颜色，像十二次呼吸。不必着急，慢慢翻。"});
SLIDES.push({t:'intro', nar:"中国人给颜色起名字，从来不编号。他们看月、看山、看雨后的天、看松烟烧过的墨，于是每一种颜色，都有了自己的体温。"});
C.forEach(c => SLIDES.push(Object.assign({t:'color'}, c)));
SLIDES.push({t:'index', nar:"这是十二种颜色聚在一起的样子。它们彼此并不争辩，只是安静地挨着。"});
SLIDES.push({t:'end', nar:"愿你此后看天、看水、看一面旧墙，都能叫出它们的名字。谢谢观看。"});

const deck = document.getElementById('deck');
const TOTAL = SLIDES.length;
const pad2 = n => String(n).padStart(2,'0');

function washHTML(){
  return `<div class="wash">` + C.map((c,i)=>{
    const pos=[[-6,4],[18,-8],[42,10],[62,-4],[80,12],[2,40],[26,52],[50,38],[70,44],[88,26],[14,20],[36,22]][i];
    const size=[380,300,340,280,320,300,360,260,300,280,320,300][i];
    return `<i style="background:${c.hex};left:${pos[0]}%;top:${pos[1]}%;width:${size}px;height:${size}px;opacity:.55"></i>`;
  }).join('') + `</div>`;
}

function coverageHTML(){
  return `
  <div class="cover-wrap">
    ${washHTML()}
    <div class="grain"></div>
    <div class="sealbox"><span>中 国</span><span>传 统 色</span></div>
    <div class="cover-panel">
      <div class="cover-title">东方色谱</div>
      <div class="cover-sub">ORIENTAL PALETTE</div>
      <div class="cover-cn">十二次关于颜色的停留</div>
    </div>
    <div class="bars">${C.map((c,i)=>`<i style="background:${c.hex};animation-delay:${0.5+i*0.07}s"></i>`).join('')}</div>
  </div>`;
}

function introHTML(){
  return `
  <div class="bg"></div><div class="grain"></div>
  <div class="intro-wrap">
    <div class="pager"><b>序</b></div>
    <div class="intro-h">颜色，是时间的语言</div>
    <div class="intro-sub">关于命名的一桩旧事</div>
    <div class="intro-lead">潘通配色系统将色彩编号为 19-4052，而中国人只是抬头看了看天——<br>
      「雨过天晴云破处」，于是有了天青；「月白色」，于是有了月白。<br>
      在被定义之前，颜色先被看见。</div>
    <div class="intro-cards">
      <div class="intro-card"><h4>观物取色</h4><p>月下者为月白，雨后为天青，<br>苔痕成石绿，赤土即赭石。</p></div>
      <div class="intro-card"><h4>以诗命名</h4><p>一色一名皆成意象，<br>念出名字，颜色便有了画面。</p></div>
      <div class="intro-card"><h4>五色成礼</h4><p>青赤黄白黑，<br>与五行、五方、四时相配。</p></div>
    </div>
  </div>
  <div class="foot"><span>东方色谱 · ORIENTAL PALETTE</span><span class="r">${pad2(2)} / ${TOTAL}</span></div>`;
}

function colorHTML(s, i){
  const no = i - 1; // 色序号
  const ringSize = 430 + (no % 3) * 40;
  return `
  <div class="bg"></div>
  <div class="b1" style="right:-140px;top:-160px"></div>
  <div class="b2" style="left:-120px;bottom:-180px"></div>
  <div class="b3" style="left:60px;top:100px;background:${s.hex}"></div>
  <div class="ring" style="width:${ringSize}px;height:${ringSize}px;left:24px;top:${150 + (no%4)*18}px"></div>
  <div class="ring" style="width:180px;height:180px;right:520px;bottom:60px;opacity:.12"></div>
  <div class="grain"></div><div class="vign"></div>
  <div class="cwrap">
    <div class="pager"><b>${pad2(no)}</b> &nbsp;/&nbsp; 12</div>
    <div class="pinyin-top">
      <div class="p">${s.p}</div>
      <div class="hex">${s.hex} · R${parseInt(s.hex.slice(1,3),16)} G${parseInt(s.hex.slice(3,5),16)} B${parseInt(s.hex.slice(5,7),16)}</div>
    </div>
    <div class="ctitle">${s.n.split('').map(ch=>`<span>${ch}</span>`).join('')}</div>
    <div class="cbody">
      <div class="poem">${s.poem}</div>
      <div class="rule"></div>
      <div class="desc">${s.desc}</div>
      <div class="chips">${s.chips.map(c=>`<i style="background:${c}">${c}</i>`).join('')}</div>
    </div>
    <div class="bigno">${pad2(no)}</div>
  </div>
  <div class="foot"><span>${s.n} &nbsp;·&nbsp; ${s.p}</span><span class="r">${pad2(i+1)} / ${TOTAL}</span></div>`;
}

function indexHTML(){
  return `
  <div class="bg"></div><div class="grain"></div>
  <div class="idx-wrap">
    <div class="idx-h">色 卡</div>
    <div class="idx-sub">THE TWELVE · 点击任一色块可跳转</div>
    <div class="idx-grid">
      ${C.map((c,i)=>`
        <div class="idx-item" data-goto="${i+2}">
          <div class="sw" style="background:${c.hex}">${c.n}</div>
          <div class="mn">${c.hex.toUpperCase()}</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="foot"><span>东方色谱 · ORIENTAL PALETTE</span><span class="r">${pad2(TOTAL-1)} / ${TOTAL}</span></div>`;
}

function endHTML(){
  return `
  <div class="bg"></div>
  ${washHTML()}
  <div class="grain"></div>
  <div class="end-wrap">
    <div class="q">愿你此后看天、看水、看一面旧墙，<br>都能叫出它们的名字。</div>
    <div class="en">THANK YOU FOR WATCHING</div>
    <div class="sm">《东方色谱》 · 十二种中国传统色 · 完</div>
  </div>
  <div class="foot"><span>东方色谱 · ORIENTAL PALETTE</span><span class="r">${pad2(TOTAL)} / ${TOTAL}</span></div>`;
}

/* ---- 构建 DOM ---- */
deck.innerHTML = SLIDES.map((s,i)=>{
  let inner, tone='dark', c='#1A1815', ink='#EFE7DA';
  if(s.t==='cover'){ inner = coverageHTML(); }
  else if(s.t==='intro'){ tone='light'; c='#E9E1D0'; ink='#3E3626'; inner = introHTML(); }
  else if(s.t==='color'){ tone=s.tone; c=s.hex; ink=s.ink; inner = colorHTML(s,i); }
  else if(s.t==='index'){ tone='light'; c='#E9E1D0'; ink='#3E3626'; inner = indexHTML(); }
  else { tone='dark'; c='#181716'; ink='#EFE7DA'; inner = endHTML(); }
  return `<section class="slide" data-i="${i}" data-type="${s.t}" data-tone="${tone}"
      style="--c:${c};--ink:${ink};color:${ink}">${inner}</section>`;
}).join('');

const sections = [...deck.querySelectorAll('.slide')];
const bgm = document.getElementById('bgm');
const prog = document.getElementById('progress');
const hint = document.getElementById('navHint');

/* ========================= 状态与导航 ========================= */
let cur = -1, autoOn = false, musOn = true, narOn = true, started = false;
let wheelLock = false, autoTimer = null, safeTimer = null;

function goTo(i, force){
  if(i < 0 || i >= TOTAL || i === cur) return;
  i = Math.min(i, TOTAL-1);
  sections.forEach(s => { s.classList.remove('active'); s.classList.remove('past'); });
  sections[i].classList.add('active');
  sections.forEach((s,k)=>{ if(k < i) s.classList.add('past'); });
  cur = i;
  prog.style.width = (cur/(TOTAL-1)*100) + '%';
  stopSpeak();
  if(narOn && started) speak(SLIDES[cur].nar || '');
}
function next(){ if(cur < TOTAL-1) goTo(cur+1); else stopAuto(); }
function prev(){ goTo(cur-1); }

function fit(){
  const s = Math.min(window.innerWidth/1620, window.innerHeight/920, 1);
  deck.style.transform = `scale(${s.toFixed(4)})`;
}
window.addEventListener('resize', fit); fit();

/* ========================= 解说（浏览器语音合成） ========================= */
function pickVoice(){
  const vs = speechSynthesis.getVoices() || [];
  return vs.find(v => /zh[-_]?CN|Chinese/i.test(v.lang + ' ' + v.name)) || null;
}
function stopSpeak(){
  clearTimeout(autoTimer); clearTimeout(safeTimer);
  if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }
}
function speak(text){
  if(!text || !('speechSynthesis' in window) || !narOn) {
    if(autoOn) autoTimer = setTimeout(next, 2600);
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.88; u.pitch = 1.0; u.volume = 1;
  const v = pickVoice(); if(v) u.voice = v;
  u.onend = () => { if(autoOn) autoTimer = setTimeout(next, 2400); };
  u.onerror = () => { if(autoOn) autoTimer = setTimeout(next, 1800); };
  try{ speechSynthesis.speak(u); }catch(e){ if(autoOn) autoTimer = setTimeout(next, 2600); }
  const est = 900 + text.length * 340;
  clearTimeout(safeTimer);
  safeTimer = setTimeout(()=>{ if(autoOn){ speechSynthesis.cancel(); next(); } }, est + 7000);
}

/* ========================= 自动放映 ========================= */
function setAuto(on){
  autoOn = on;
  document.getElementById('bPlay').innerHTML = on ? '■ 停止' : '▶ 放映';
  document.getElementById('bPlay').classList.toggle('on', on);
  if(on){ started = true; if(musOn) tryPlay(); speak(SLIDES[cur].nar || ''); }
  else { stopSpeak(); }
}

/* ========================= 背景音乐 ========================= */
function tryPlay(){
  bgm.volume = 0.34;
  const p = bgm.play();
  if(p && p.catch) p.catch(()=>{});
}
function setMus(on){
  musOn = on;
  document.getElementById('bMus').classList.toggle('on', on);
  if(on) tryPlay(); else bgm.pause();
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
}
function setNar(on){
  narOn = on;
  document.getElementById('bNar').classList.toggle('on', on);
  if(on){ if(started) speak(SLIDES[cur].nar || ''); }
  else { if('speechSynthesis' in window) speechSynthesis.cancel(); }
}

/* ========================= 事件绑定 ========================= */
const gate = document.getElementById('gate');
function start(){
  gate.classList.add('hide');
  started = true;
  hint.style.opacity = '1';
  setTimeout(()=>{ hint.style.opacity='0'; }, 6000);
  goTo(0, true);
  if(narOn){ setTimeout(()=>speak(SLIDES[0].nar), 600); }
  if(!autoOn && musOn) tryPlay();
}
gate.addEventListener('click', start);
document.getElementById('gateBtn').addEventListener('click', e => { e.stopPropagation(); start(); });

document.addEventListener('keydown', e=>{
  if(!started) { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); start(); } return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); autoOn ? next() : next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ goTo(0); }
  else if(e.key==='End'){ goTo(TOTAL-1); }
  else if(e.key.toLowerCase()==='m'){ setMus(!musOn); }
  else if(e.key.toLowerCase()==='n'){ setNar(!narOn); }
});

deck.addEventListener('click', e=>{
  const item = e.target.closest('[data-goto]');
  if(item){ stopAuto(); goTo(+item.dataset.goto); return; }
  if(e.clientX < window.innerWidth*0.5) prev(); else next();
});
window.addEventListener('wheel', e=>{
  if(!started) return;
  if(wheelLock) return;
  wheelLock = true; setTimeout(()=>wheelLock=false, 620);
  if(e.deltaY > 0) next(); else prev();
}, {passive:true});

let tx = 0;
window.addEventListener('touchstart', e=> tx = e.touches[0].clientX, {passive:true});
window.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) > 40){ dx < 0 ? next() : prev(); }
}, {passive:true});

document.getElementById('bNext').addEventListener('click', e=>{ e.stopPropagation(); next(); });
document.getElementById('bPrev').addEventListener('click', e=>{ e.stopPropagation(); prev(); });
document.getElementById('bPlay').addEventListener('click', e=>{ e.stopPropagation(); setAuto(!autoOn); });
document.getElementById('bMus').addEventListener('click', e=>{ e.stopPropagation(); setMus(!musOn); });
document.getElementById('bNar').addEventListener('click', e=>{ e.stopPropagation(); setNar(!narOn); });

if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => pickVoice();
document.getElementById('bMus').classList.add('on');
document.getElementById('bNar').classList.add('on');
function stopAuto(){ if(autoOn) setAuto(false); }
</script>
</body>
</html>
